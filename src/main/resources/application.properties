spring.application.name=contact-management
server.port=${SERVER_PORT:9981}

# Primary PostgreSQL database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_PRIMARY_URL:jdbc:postgresql://localhost:5432/contact_management}
spring.datasource.username=${DB_PRIMARY_USERNAME:postgres}
spring.datasource.password=${DB_PRIMARY_PASSWORD:}

# Secondary PostgreSQL database
spring.second-datasource.driver-class-name=org.postgresql.Driver
spring.second-datasource.url=${DB_SECONDARY_URL:jdbc:postgresql://localhost:5432/contact_management}
spring.second-datasource.username=${DB_SECONDARY_USERNAME:postgres}
spring.second-datasource.password=${DB_SECONDARY_PASSWORD:}

# Scheduled executor
execution.pool.size=${EXECUTION_POOL_SIZE:10}

# JWT
security.jwt.secret=${JWT_SECRET_BASE64:}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# CORS
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
